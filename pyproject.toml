[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrace-kit"
version = "0.1.0"
description = "Lightweight Python error tracking SDK for Retrace Kit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ildar Timerbaev" }]
keywords = ["error-tracking", "python", "monitoring", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi"]
django = ["django>=4.2"]
dev = ["ruff", "mypy", "pytest", "httpx", "build"]

[project.urls]
Homepage = "https://retracekit.cloud"
Repository = "https://github.com/RetraceKit/sdk-python"
Issues = "https://github.com/RetraceKit/sdk-python/issues"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "httpx", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/retrace_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/retrace_kit/*.py" = ["BLE001", "S110"]
"src/retrace_kit/integrations/django.py" = ["I001"]
"tests/**/*.py" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["retrace_kit"]
